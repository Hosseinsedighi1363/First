<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آزمون فیزیک - داشبورد دانشجویی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>آزمون فیزیک</h1>
    </header>
    <div class="container">
        <aside>
            <div class="quiz-timer">
                <p>زمان باقی‌مانده:</p>
                <span id="timer">10:00</span>
            </div>
        </aside>
        <main>
            <div class="quiz-container">
                <div class="question">
                    <h3>سوال ۱: کدام یک از موارد زیر واحد اندازه‌گیری نیرو است؟</h3>
                    <div class="options">
                        <label><input type="radio" name="q1" value="a"> الف) پاسکال</label>
                        <label><input type="radio" name="q1" value="b"> ب) نیوتن</label>
                        <label><input type="radio" name="q1" value="c"> ج) ژول</label>
                        <label><input type="radio" name="q1" value="d"> د) وات</label>
                    </div>
                </div>
                <hr>
                <div class="question">
                    <h3>سوال ۲: قانون دوم نیوتن به کدام صورت بیان می‌شود؟</h3>
                    <div class="options">
                        <label><input type="radio" name="q2" value="a"> الف) F = ma</label>
                        <label><input type="radio" name="q2" value="b"> ب) P = IV</label>
                        <label><input type="radio" name="q2" value="c"> ج) V = IR</label>
                        <label><input type="radio" name="q2" value="d"> د) E = mc²</label>
                    </div>
                </div>
                <!-- More questions would be added here -->
                <button class="submit-quiz">پایان آزمون و ارسال پاسخ‌ها</button>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
