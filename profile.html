<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>پروفایل کاربری - داشبورد دانشجویی</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <h1>داشبورد دانشجویی</h1>
    </header>
    <div class="container">
        <aside>
            <nav>
                <ul>
                    <li><a href="index.html">پیشخوان</a></li>
                    <li><a href="profile.html" class="active">پروفایل کاربری</a></li>
                    <li><a href="assignments.html">تکالیف</a></li>
                    <li><a href="quizzes.html">آزمون‌ها</a></li>
                    <li><a href="#">خروج</a></li>
                </ul>
            </nav>
        </aside>
        <main>
            <h2>پروفایل کاربری</h2>
            <div class="profile-details">
                <!-- User's profile picture will be displayed here. -->
                <!-- <img src="images/profile-placeholder.png" alt="عکس پروفایل" class="profile-pic"> -->
                <div class="profile-pic-placeholder"></div>
                <div>
                    <p><strong>نام و نام خانوادگی:</strong> علی علوی</p>
                    <p><strong>شماره دانشجویی:</strong> 987654321</p>
                    <p><strong>ایمیل:</strong> ali.alavi@example.com</p>
                </div>
            </div>

            <div class="profile-edit-form">
                <h3>ویرایش اطلاعات</h3>
                <form>
                    <label for="fullName">نام و نام خانوادگی:</label>
                    <input type="text" id="fullName" name="fullName" value="علی علوی">

                    <label for="email">ایمیل:</label>
                    <input type="email" id="email" name="email" value="ali.alavi@example.com">

                    <label for="profilePic">تغییر عکس پروفایل:</label>
                    <input type="file" id="profilePic" name="profilePic">

                    <button type="submit">ذخیره تغییرات</button>
                </form>
            </div>
        </main>
    </div>
    <script src="js/script.js"></script>
</body>
</html>
